databaseChangeLog:
  - changeSet:
      id: dml-driver-license-document-type-hu-int-16
      author: danna-barrios
      labels: "hu-int-16,kyc"
      changes:
        - sql: |
            INSERT INTO iam.document_types (code, name, requires_front_and_back)
            VALUES ('DRIVER_LICENSE', 'Driver License', FALSE)
            ON CONFLICT (code) DO NOTHING;
      rollback:
        - sql: "DELETE FROM iam.document_types WHERE code = 'DRIVER_LICENSE';"
