services:
  postgres:
    image: postgres:17-alpine
    container_name: drivique-postgres-dev
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-drivique_dev}
      POSTGRES_USER: ${DB_USERNAME:-drivique_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-drivique_dev_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - drivique-network

networks:
  drivique-network:
    driver: bridge

volumes:
  postgres_dev_data:
    name: drivique_postgres_dev_data
